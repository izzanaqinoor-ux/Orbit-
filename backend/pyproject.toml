[project]
name = "orbit-backend"
version = "0.1.0"
description = "Orbit — a time-management system for student-workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "uuid6>=2024.1.12",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
